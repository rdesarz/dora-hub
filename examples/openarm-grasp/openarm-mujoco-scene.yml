_unstable_debug:
  publish_all_messages_to_zenoh: true

nodes:
  # Minimal OpenArm-in-MuJoCo smoke test.
  #
  # Run from this directory:
  #   dora build openarm-mujoco-scene.yml
  #   dora run openarm-mujoco-scene.yml
  #
  # This only launches the simulated scene from the sibling openarm_mujoco clone
  # and publishes MuJoCo state. It does not yet emulate the RealSense image/depth
  # outputs or the dora-openarm driver contract used by pick-and-place.yml.
  - id: mujoco_sim
    build: uv sync --project ../../node-hub/dora-mujoco
    path: uv
    args: run --project ../../node-hub/dora-mujoco python -m dora_mujoco
    inputs:
      tick: dora/timer/millis/2
      camera_tick: dora/timer/millis/100
    outputs:
      - joint_positions
      - joint_velocities
      - actuator_controls
      - joint_state
      - left_joint_state
      - right_joint_state
      - sensor_data
      - image
      - depth
    env:
      MODEL_NAME: "sim/scene.xml"
      CAMERA_NAME: "pick_place_camera"
      IMAGE_WIDTH: "1280"
      IMAGE_HEIGHT: "720"
      MUJOCO_GL: "egl"
      SHOW_VIEWER: "true"
      PYTHONPATH: "../../node-hub/dora-mujoco"

  - id: depth_viz
    path: uv
    args: run --project ../../node-hub/dora-mujoco python depth_visualizer.py
    inputs:
      depth:
        source: mujoco_sim/depth
        queue_size: 1
    outputs:
      - depth_image
    env:
      IMAGE_WIDTH: "1280"
      IMAGE_HEIGHT: "720"
      OUTPUT_DIR: "out/depth"
      SAVE_EVERY: "10"
      MIN_DEPTH_MM: "0"
      MAX_DEPTH_MM: "2000"

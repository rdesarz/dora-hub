_unstable_debug:
  publish_all_messages_to_zenoh: true

nodes:
  # --- MuJoCo simulation: arm state, arm control, and RGBD camera ---
  - id: mujoco_sim
    build: uv sync --project ../../node-hub/dora-mujoco
    path: uv
    args: run --project ../../node-hub/dora-mujoco python -m dora_mujoco
    inputs:
      tick: dora/timer/millis/2
      camera_tick: dora/timer/millis/100
      joint_command:
        source: motion_planner/joint_command
        queue_size: 1
      gripper_command:
        source: motion_planner/gripper_command
        queue_size: 1
    outputs:
      - image
      - depth
      - joint_state
      - left_joint_state
      - right_joint_state
      - joint_positions
      - joint_velocities
      - actuator_controls
    env:
      MODEL_NAME: "sim/scene.xml"
      CAMERA_NAME: "pick_place_camera"
      IMAGE_WIDTH: "1280"
      IMAGE_HEIGHT: "720"
      MUJOCO_GL: "egl"
      SHOW_VIEWER: "false"
      PYTHONPATH: "../../node-hub/dora-mujoco"


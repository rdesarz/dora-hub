  # --- Motion planner with MuJoCo depth and simulated joint feedback ---
  - id: motion_planner
    build: pip install -e ../../node-hub/dora-motion-planner
    path: dora-motion-planner
    inputs:
      image:
        source: mujoco_sim/image
        queue_size: 1
      depth:
        source: mujoco_sim/depth
        queue_size: 1
      joint_state: mujoco_sim/joint_state
      grasp_result: selector/grasp_result
      tick: dora/timer/millis/33
    outputs:
      - joint_trajectory
      - joint_command
      - gripper_command
      - trajectory_status
      - debug_image
    env:
      URDF_PATH: "../openarm/openarm_v10.urdf"
      END_EFFECTOR_LINK: "openarm_left_hand_tcp"
      CAMERA_TRANSFORM: "0.050000 0.880000 0.620000 0.016152 -0.022962 -0.816851 0.576166"
      IMAGE_WIDTH: "1280"
      IMAGE_HEIGHT: "720"
      DOWNSAMPLE_STRIDE: "8"
      SAFETY_MARGIN: "0.02"
      NUM_WAYPOINTS: "300"
      NUM_SEEDS: "8"
      MAX_ITERS: "500"
      DEVICE: "cuda"
      GRASP_DEPTH_OFFSET: "-0.01"
      PLACE_DEPTH_OFFSET: "0.05"
      FLOOR_HEIGHT: "0.005"
      APPROACH_MARGIN: "0.03"
      PLAYBACK: "true"
      DWELL_STEPS: "15"

